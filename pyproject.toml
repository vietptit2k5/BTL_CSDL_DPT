[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d23-nhom12-video-retrieval"
version = "0.1.0"
description = "Skeleton mapped to ND1 ND2 and D23 group12 XLSX"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "Pillow>=10", "mysql-connector-python>=9.5,<10"]

[project.optional-dependencies]
extraction = ["opencv-python-headless>=4.8", "scikit-image>=0.22", "torch>=2.2", "transformers>=4.40,<6"]

[project.scripts]
nhom12 = "nhom12.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nhom12 = ["schema.sql"]
"nhom12.storage_mysql" = ["schema.sql"]
"nhom12.webapp" = ["static/*"]
